name: Backend CI

# Path filters mean a mobile-only PR does not wait on backend checks.
on:
  push:
    branches: [main, stage]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: philly_compliance
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      # Must be >=50 chars with enough entropy or `check --deploy` fails (W009).
      DJANGO_SECRET_KEY: ci-only-throwaway-key-3f8b1c47ae92d05b6e7419acd8f230b5c1e6
      # pytest-django creates and drops test_philly_compliance from this.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/philly_compliance
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - run: pip install -r requirements/dev.txt

      # Catches "I changed a model but forgot makemigrations" before review does.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          CSRF_TRUSTED_ORIGINS: https://example.com
          # Production refuses to boot without a bucket, on purpose: uploads
          # would otherwise land on a container filesystem that the next
          # deploy throws away. This check only imports settings and never
          # stores anything, so a placeholder satisfies it - the same trick
          # the Dockerfile uses to run collectstatic. A real deploy without a
          # real bucket still fails loudly, which is the point.
          AWS_STORAGE_BUCKET_NAME: ci-only-placeholder-never-written-to
          # Required alongside the bucket: the region is baked into the S3
          # endpoint, and settings refuse a bucket without one rather than
          # build https://s3..amazonaws.com.
          AWS_S3_REGION_NAME: us-west-2

      - name: Run tests
        run: pytest
