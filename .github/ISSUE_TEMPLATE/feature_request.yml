name: Feature
description: A new capability or a change to an existing one.
labels: ["feature", "needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend, Mobile, Both, CI/Tooling]
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what can they not do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: API impact
      description: New or changed endpoints, if any. Agree this before coding starts.
